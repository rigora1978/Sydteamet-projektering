function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function paragraph(parent,text,cls='instruction'){if(text)parent.append(node('p',text,cls))}
function fields(parent,items){if(!items?.length)return;const g=node('div',undefined,'measurements');items.forEach(f=>g.append(makeField(f)));parent.append(g)}
function makeField([id,label,type]){const w=node('div',undefined,'field-wrap');const l=node('label',label);l.htmlFor=id;const e=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea'){e.type=type||'text';if(type==='number'){e.step='any';e.min='0'}}e.id=id;e.dataset.field=id;if(id==='elskapsplacering'){e.required=true;e.setAttribute('aria-required','true')}else if(id==='panelantal'||id==='takytor'){e.step='1'};e.value=project.values[id]??'';e.oninput=()=>{project.values[id]=e.value;refreshFacts();refreshEquipmentFacts();if(type==='textarea'){e.style.height='auto';e.style.height=Math.max(36,e.scrollHeight)+'px'}queueSave()};w.append(l,e);return w}
function fuseLegend(parent){const g=node('div',undefined,'fuses');for(const [name,amp,color] of [['Grå',16,'#888'],['Blå',20,'#2779bf'],['Gul',25,'#edc928'],['Svart',35,'#222'],['Vit',50,'#fff'],['Koppar',63,'#b87333']]){const t=node('span');const sw=node('span',undefined,'swatch');sw.style.background=color;t.append(sw,document.createTextNode(name+' '+amp+' A'));g.append(t)}parent.append(g)}
function imagePickers(parent,title,multiple,onFiles){const controls=node('div',undefined,'actions noprint');const inputs=[];let busy=false;for(const camera of [true,false]){const label=node('label',camera?'📷 Ta bild':'＋ Välj bilder','upload-label noprint');const input=document.createElement('input');input.type='file';input.accept='image/*';if(camera)input.setAttribute('capture','environment');else input.multiple=multiple;input.setAttribute('aria-label',(camera?'Ta bild: ':'Välj bilder: ')+title);inputs.push(input);input.onchange=async()=>{if(busy||!input.files?.length){input.value='';return}busy=true;inputs.forEach(e=>e.disabled=true);controls.setAttribute('aria-busy','true');try{await onFiles(Array.from(input.files))}catch(e){alert('Bilden kunde inte läsas. Försök igen.')}finally{input.value='';busy=false;inputs.forEach(e=>e.disabled=false);controls.removeAttribute('aria-busy')}};label.append(input);controls.append(label)}parent.append(controls)}
function photoGroup(parent,[key,title,max]){const area=node('div');if(key==='hojdavvikelse')area.append(node('h3',title,'subheading'));const g=node('div',undefined,'photo-grid');g.dataset.photos=key;g.dataset.max=max;area.append(g);paragraph(area,'Högst '+max+' bilder. Kommentarer och mått skrivs under respektive bild.','hint noprint');imagePickers(area,title,max>1,async files=>{const current=project.photos[key]||[];if(current.length+files.length>max){alert('Max '+max+' bilder. Ta bort en bild först.');return}const added=[];for(const f of files)added.push({name:f.name,data:await resizeImage(f),caption:''});project.photos[key]=[...current,...added];renderPhotos(key,g);queueSave()});parent.append(area)}
