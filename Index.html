function newId(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4)),v=>v.toString(36)).join('-')}

const sections=[
{title:'Kund och projekt',fields:[F('kund','Kund / beställare'),F('adress','Fastighetsadress'),F('postort','Postnummer och ort'),F('telefon','Telefon'),F('epost','E-post'),F('kontakt','Kontaktperson på plats'),F('besok','Datum för platsbesök','date'),F('projektor','Projekterat av'),F('projektnr','Projekt-/ärendenummer')]},

{title:'Ytor där paneler ska installeras',group:'SOLCELLER',fields:[F('takfoth','Takfot – höjd från mark (m)','number'),F('nock','Nock (m)','number'),F('taklutning','Taklutning (°)','number'),F('takytor','Antal takytor med solceller','number')],photos:[['takgavel','Takytor',4]]},
{title:'Närbilder på undertak',fields:[F('pannbredd','Bredd på pannor (cm)','number'),F('taktyp','Taktyp'),F('undertaktyp','Typ av undertak')],photos:[['takmatt','Närbilder och mått',4]]},
{title:'Arbetsyta',photos:[['arbetsyta','Arbetsyta',4]]},

{title:'DC-dragning',fields:[F('dcmeter','Panelgrupp till växelriktare (m)','number')],photos:[['dcbilder','DC-dragning',4]]},
{title:'AC-dragning',fields:[F('acmeter','AC-kabelsträcka (m)','number')],photos:[['acbilder','AC-dragning',4]]},
{title:'LAN-dragning',fields:[F('lanmeter','LAN-kabel (m)','number')],photos:[['lanbilder','LAN-dragning',4]]},
{title:'Befintlig innedel',group:'VÄRMEPUMP',instruction:'Ta bilder på den befintliga innedelen: översiktsbild – hela innedelen, och närbild – rördragningen ovanför innedelen.',photos:[['innedelbilder','Befintlig innedel',4]]},
{title:'Höjder',instruction:'Mät från golvet där innedelen står.',fields:[F('rumshojd','Golv till tak (cm)','number'),F('rorhojd','Golv till rördragningens lägsta punkt (cm)','number')],photos:[['matbilder','Höjdmått',2]],question:'Fråga kunden om takhöjden skiljer sig i olika delar av rummet. Notera om något kan påverka var den nya innedelen får plats.',extra:[['hojdavvikelse','Avvikelse i takhöjd / placering',1]],answer:[F('rumforuts','Kundens svar / avvikelse','textarea')],note:'Kom ihåg: måttet till taket och måttet till rören är två olika mått.'},
{title:'Placering av utedel',instruction:'Ta en bild och peka tydligt på var kunden önskar utedelen. Kontrollera om buskar, trappor eller annat är i vägen. Placeringen kan behöva ändras efter kontroll. Visa kunden hur mycket plats utedelen ungefär tar.',photos:[['utedelbilder','Önskad placering av utedel',4]],sizes:true},
{title:'Rörväg och avstånd',instruction:'Mät ungefärligt avstånd mellan innedel och utedel längs den tänkta rörvägen. Visa eller fotografera vägen om den inte framgår tydligt.',fields:[F('rorlangd','Avstånd (meter)','number')],photos:[['rorvagbilder','Rörväg och avstånd',4]],note:'OBS! Försök alltid komma överens med kunden om en så kort rörväg som möjligt. Placera utedelen så nära innedelen som det är praktiskt möjligt.'},
{title:'Demontering och bortforsling',instruction:'Fråga kunden vad som ska vara kvar och vad som ska tas bort. Ta en bild på varje sak som ska demonteras. Notera om den behöver sågas ner innan bortforsling.',fields:[F('demontera','Ska demonteras / forslas bort','textarea'),F('behalla','Ska vara kvar','textarea'),F('sagning','Behöver sågas ner före bortforsling?')],photos:[['demonterbilder','Demontering och bortforsling',4]],foundation:true},
{title:'Transportväg och plats för leverans',screenInstruction:'Kontrollera hur utrustningen ska tas från leveransplatsen till den tänkta placeringen. Visa hur man tar sig fram till värmepumpens placering. Är det en smal trappa, en trång passage, en källarnedgång eller en enkel väg via garage? Ta med eventuella hinder och låga dörröppningar.',photos:[['transportbilder','Transportväg och leveransplats',4]]},

];
const root=document.getElementById('formRoot');let project={id:newId(),values:{},photos:{},updated:0};let db,saveTimer;let activeMarker=0,deleteMarker=false;
const markerTypes=[['▣','Växelriktare'],['▤','Batteri'],['⚡','Elcentral'],['⚡','Undercentral'],['↗','DC-dragning'],['↗','AC-dragning'],['⇩','Avlämningsplats'],['◉','Internetrouter'],['▣','Laddbox'],['▥','Innedel värmepump'],['❄','Utedel värmepump']];
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function paragraph(parent,text,cls='instruction'){if(text)parent.append(node('p',text,cls))}
function fields(parent,items){if(!items?.length)return;const g=node('div',undefined,'measurements');items.forEach(f=>g.append(makeField(f)));parent.append(g)}
function makeField([id,label,type]){const w=node('div',undefined,'field-wrap');const l=node('label',label);l.htmlFor=id;const e=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea'){e.type=type||'text';if(type==='number'){e.step='any';e.min='0'}}e.id=id;e.dataset.field=id;e.value=project.values[id]??'';e.oninput=()=>{project.values[id]=e.value;refreshFacts();if(type==='textarea'){e.style.height='auto';e.style.height=Math.max(36,e.scrollHeight)+'px'}queueSave()};w.append(l,e);return w}
function fuseLegend(parent){const g=node('div',undefined,'fuses');for(const [name,amp,color] of [['Grå',16,'#888'],['Blå',20,'#2779bf'],['Gul',25,'#edc928'],['Svart',35,'#222'],['Vit',50,'#fff'],['Koppar',63,'#b87333']]){const t=node('span');const sw=node('span',undefined,'swatch');sw.style.background=color;t.append(sw,document.createTextNode(name+' '+amp+' A'));g.append(t)}parent.append(g)}
function photoGroup(parent,[key,title,max]){const area=node('div');if(key==='hojdavvikelse')area.append(node('h3',title,'subheading'));const g=node('div',undefined,'photo-grid');g.dataset.photos=key;g.dataset.max=max;area.append(g);const label=node('label','＋ Lägg till bilder · max '+max,'upload-label noprint');const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=max>1;input.setAttribute('aria-label',title);input.onchange=async()=>{const files=Array.from(input.files);const current=project.photos[key]||[];if(current.length+files.length>max){alert('Max '+max+' bilder. Ta bort en bild först.');input.value='';return}input.disabled=true;try{const added=[];for(const f of files)added.push({name:f.name,data:await resizeImage(f),caption:''});project.photos[key]=[...current,...added];renderPhotos(key,g);queueSave()}catch(e){alert('Bilden kunde inte läsas. Välj en annan bild.')}finally{input.disabled=false;input.value=''}};label.append(input);area.append(label);parent.append(area)}
function renderPhotos(key,el){el.replaceChildren();(project.photos[key]||[]).forEach((p,i)=>{const c=node('figure',undefined,'photo');const img=node('img');img.src=p.data;img.alt=p.caption||'Bild '+(i+1);const cap=node('textarea',undefined,'photo-caption');cap.placeholder='Kommentar / mått';cap.setAttribute('aria-label','Kommentar under bild '+(i+1));cap.value=p.caption||'';cap.oninput=()=>{p.caption=cap.value;cap.style.height='auto';cap.style.height=Math.max(36,cap.scrollHeight)+'px';queueSave()};const remove=node('button','Ta bort bild','danger noprint');remove.onclick=()=>{project.photos[key].splice(i,1);renderPhotos(key,el);queueSave()};c.append(img,cap,remove);el.append(c)})}
function sizes(parent){const d=node('details',undefined,'screen-only noprint note');d.append(node('summary','Ungefärlig storlek på utedel – stöd till projektören'));const t=node('table');for(const row of [['Leverantör / modell','B × H × D'],['Daikin','ca 109 × 74 × 35 cm'],['NIBE F2040-8','ca 104 × 90 × 42 cm'],['Qvantum QA9','ca 117 × 80 × 40 cm'],['Qvantum QA15','ca 129 × 93 × 47 cm']]){const tr=node('tr');row.forEach(v=>tr.append(node('td',v)));t.append(tr)}d.append(t);paragraph(d,'Måtten varierar mellan modeller. Större utedelar kan förekomma – kontrollera modell om den är ovanligt stor.');parent.append(d)}
function overview(parent){paragraph(parent,'Ladda upp en översiktsbild. Välj en ikon och klicka på bilden där den ska placeras. Du kan placera samma ikon flera gånger.','instruction noprint');const tools=node('div',undefined,'tools noprint');markerTypes.forEach(([icon,title],i)=>{const b=node('button',icon+' '+title);b.classList.toggle('active',i===activeMarker&&!deleteMarker);b.onclick=()=>{activeMarker=i;deleteMarker=false;refreshOverview()};tools.append(b)});const del=node('button','Ta bort markering');del.classList.toggle('active',deleteMarker);del.onclick=()=>{deleteMarker=!deleteMarker;refreshOverview()};tools.append(del);parent.append(tools);const input=document.createElement('input');input.type='file';input.accept='image/*';input.setAttribute('aria-label','Översiktsbild');input.className='noprint';input.onchange=async()=>{if(!input.files[0])return;if(project.overview?.markers?.length&&!confirm('Byta bild och ta bort markeringarna?'))return;try{project.overview={data:await resizeImage(input.files[0]),markers:[]};refreshOverview();queueSave()}catch(e){alert('Bilden kunde inte läsas.')}};parent.append(input);if(project.overview?.data){const stage=mapStage(false);stage.onclick=e=>{if(e.target.closest('.marker'))return;if(deleteMarker)return;const r=stage.getBoundingClientRect();project.overview.markers.push({type:activeMarker,x:Math.min(.98,Math.max(.02,(e.clientX-r.left)/r.width)),y:Math.min(.98,Math.max(.02,(e.clientY-r.top)/r.height))});refreshOverview();queueSave()};parent.append(stage)}else paragraph(parent,'Ingen översiktsbild uppladdad ännu.','hint')}
function mapStage(report){const stage=node('div',undefined,'mapstage');const img=node('img');img.src=project.overview.data;img.alt='Översiktsbild med placeringar';stage.append(img);(project.overview.markers||[]).forEach((m,i)=>{if(!markerTypes[m.type])return;const [icon,title]=markerTypes[m.type];const b=node(report?'span':'button',icon+' '+title,'marker');b.style.left=(m.x*100)+'%';b.style.top=(m.y*100)+'%';b.style.transform='translate('+(m.x<.22?'0':m.x>.78?'-100%':'-50%')+', '+(m.y<.1?'0':m.y>.9?'-100%':'-50%')+')';if(!report){b.title='Välj Ta bort markering för att radera';b.onclick=e=>{e.stopPropagation();if(deleteMarker){project.overview.markers.splice(i,1);refreshOverview();queueSave()}}}stage.append(b)});return stage}
function refreshOverview(){const sec=document.querySelector('[data-overview]');if(!sec)return;sec.replaceChildren();overview(sec)}
function refreshFacts(){let box=document.getElementById('formFacts');if(!box){box=node('aside',undefined,'facts-box');box.id='formFacts';root.append(box)}box.replaceChildren(node('h2','Fakta om taket'));const grid=node('div',undefined,'facts-grid');for(const [key,label,unit] of [['takfoth','Höjd på takfot','m'],['taklutning','Taklutning','°'],['takytor','Antal takytor med solceller',''],['taktyp','Typ av tak','']]){const item=node('div');item.append(node('b',label));const value=project.values[key];item.append(node('span',value!==undefined&&value!==''?value+(unit?' '+unit:''):'Ej ifyllt'));grid.append(item)}box.append(grid);paragraph(box,'Uppgifterna hämtas automatiskt från punkt 4 och 5.','hint')}
function build(){root.replaceChildren();sections.forEach((s,i)=>{const sec=node('section',undefined,'step');if(s.group)sec.append(node('div',s.group,'section-label'));sec.append(node('h2',(i+1)+'. '+s.title));paragraph(sec,s.instruction);paragraph(sec,s.screenInstruction,'instruction screen-only noprint');fields(sec,s.fields);if(s.overview){const box=node('div');box.dataset.overview='1';sec.append(box);overview(box)}if(s.fuses){fuseLegend(sec);fields(sec,[F('sakringkommentar','Kommentar till säkringar','textarea')])}(s.photos||[]).forEach(p=>photoGroup(sec,p));paragraph(sec,s.question);fields(sec,s.answer);(s.extra||[]).forEach(p=>photoGroup(sec,p));paragraph(sec,s.note,'note');if(s.sizes)sizes(sec);if(s.foundation){paragraph(sec,'Befintlig stabil betong eller färdiga betongblock: ofta behövs inget nytt fundament.','note');paragraph(sec,'Ojämn mark eller otillräckligt underlag: makadam och betongblock kan behövas.','note');paragraph(sec,'Om det inte går att lösa så: gjutning kan behövas. Ta bild på marken och notera förutsättningarna.','note');photoGroup(sec,['fundbilder','Mark och fundament',1]);fields(sec,[F('fundnot','Kommentar till mark / fundament','textarea')])}paragraph(sec,s.screenNote,'note screen-only noprint');fields(sec,[F('kommentar_'+i,'Kommentar','textarea')]);root.append(sec)});refreshForm()}
function refreshForm(){project.photos=project.photos||{};for(const e of document.querySelectorAll('[data-field]')){e.value=project.values[e.dataset.field]??'';if(e.tagName==='TEXTAREA'){e.style.height='auto';e.style.height=Math.max(36,e.scrollHeight)+'px'}}for(const e of document.querySelectorAll('[data-photos]'))renderPhotos(e.dataset.photos,e);refreshOverview();refreshFacts()}
function reportFields(parent,items){if(!items)return;const g=node('div',undefined,'measurements');for(const [key,label]of items){const v=project.values[key];if(v===undefined||v==='')continue;const d=node('div',undefined,'report-field');const unit=label.match(/\((cm|m|meter|°)\)$/);const name=unit?label.replace(/\s*\([^)]*\)$/,''):label;d.append(node('b',name+': '),document.createTextNode(v+(unit?' '+unit[1]:'')));g.append(d)}if(g.children.length)parent.append(g)}
function reportPhotos(parent,[key,title]){const list=project.photos[key]||[];if(!list.length)return;const g=node('div',undefined,'photo-grid');for(const [i,p]of list.entries()){const f=node('figure',undefined,'photo');const img=node('img');img.src=p.data;img.alt=title+' '+(i+1);f.append(img);if(p.caption)f.append(node('figcaption',p.caption));g.append(f)}parent.append(g)}
function makeReport(){let r=document.getElementById('report');if(!r){r=node('div');r.id='report';document.body.append(r)}r.replaceChildren();const bar=node('div',undefined,'previewbar');const back=node('button','Tillbaka till formuläret');back.onclick=()=>document.body.classList.remove('previewing');const print=node('button','Skriv ut / Spara som PDF');print.onclick=()=>window.print();bar.append(back,print);r.append(bar,node('h1','SYDTEAMET · Projekteringsunderlag','report-title'));paragraph(r,[project.values.adress,project.values.kund,project.values.besok].filter(Boolean).join(' · '),'report-subtitle');sections.forEach((s,i)=>{const sec=node('section',undefined,'step');sec.append(node('h2',(i+1)+'. '+s.title));paragraph(sec,s.instruction);reportFields(sec,s.fields);if(s.overview&&project.overview?.data)sec.append(mapStage(true));if(s.fuses){fuseLegend(sec);reportFields(sec,[F('sakringkommentar','Kommentar till säkringar')])}(s.photos||[]).forEach(p=>reportPhotos(sec,p));paragraph(sec,s.question);reportFields(sec,s.answer);(s.extra||[]).forEach(p=>reportPhotos(sec,p));paragraph(sec,s.note,'note');if(s.foundation){paragraph(sec,'Befintlig stabil betong eller färdiga betongblock: ofta behövs inget nytt fundament.','note');paragraph(sec,'Ojämn mark eller otillräckligt underlag: makadam och betongblock kan behövas.','note');paragraph(sec,'Om det inte går att lösa så: gjutning kan behövas. Ta bild på marken och notera förutsättningarna.','note');reportPhotos(sec,['fundbilder','Mark och fundament']);reportFields(sec,[F('fundnot','Kommentar till mark / fundament')])}if(project.values['kommentar_'+i])paragraph(sec,project.values['kommentar_'+i],'report-comment');r.append(sec)});const facts=node('aside',undefined,'facts-box');facts.append(node('h2','Fakta om taket'));const grid=node('div',undefined,'facts-grid');for(const [key,label,unit] of [['takfoth','Höjd på takfot','m'],['taklutning','Taklutning','°'],['takytor','Antal takytor med solceller',''],['taktyp','Typ av tak','']]){const item=node('div');item.append(node('b',label));const value=project.values[key];item.append(node('span',value!==undefined&&value!==''?value+(unit?' '+unit:''):'—'));grid.append(item)}facts.append(grid);r.append(facts);return r}
function resizeImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let scale=Math.min(1,1600/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.77))};img.src=reader.result};reader.readAsDataURL(file)})}
function openDb(){return new Promise((resolve,reject)=>{let req=indexedDB.open('sydteamet-projektering-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('projects',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function transaction(mode){return db.transaction('projects',mode).objectStore('projects')}
function request(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function save(){try{project.updated=Date.now();await new Promise((resolve,reject)=>{if(!db){reject(Error('Lokal lagring saknas'));return}const tx=db.transaction('projects','readwrite');tx.objectStore('projects').put(structuredClone(project));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Sparningen avbröts'))});await refreshList();status('Sparat lokalt '+new Date().toLocaleTimeString('sv-SE'))}catch(e){status('Kunde inte spara: '+e.message);alert('Sparning misslyckades. Exportera en säkerhetskopia.')}}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,950)}
function status(msg){document.getElementById('status').textContent=msg}
async function refreshList(){const all=await request(transaction('readonly').getAll());all.sort((a,b)=>b.updated-a.updated);let sel=document.getElementById('savedList');sel.innerHTML='<option value="">Välj sparat projekt</option>';for(const p of all){let opt=document.createElement('option');opt.value=p.id;opt.textContent=(p.values.adress||p.values.kund||'Namnlöst projekt')+' · '+new Date(p.updated).toLocaleDateString('sv-SE');sel.append(opt)}sel.value=project.id}
async function switchProject(id){if(!id)return;clearTimeout(saveTimer);await save();let p=await request(transaction('readonly').get(id));if(p){project=p;refreshForm();document.getElementById('savedList').value=id;status('Projekt öppnat')}}
function download(filename,data,mime){let url=URL.createObjectURL(new Blob([data],{type:mime}));let a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function filename(){return (project.values.adress||project.values.kund||'projekt').replace(/[^a-zA-ZåäöÅÄÖ0-9-]/g,'_').slice(0,60)}
document.getElementById('newBtn').onclick=async()=>{await save();project={id:newId(),values:{},photos:{},updated:0};refreshForm();await save();status('Nytt projekt skapat')};document.getElementById('saveBtn').onclick=save;document.getElementById('saveBottom').onclick=save;document.getElementById('savedList').onchange=e=>switchProject(e.target.value);document.getElementById('exportBtn').onclick=async()=>{await save();download('SYDTEAMET_'+filename()+'.json',JSON.stringify({format:'sydteamet-projektering-v1',project}), 'application/json')};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='sydteamet-projektering-v1'||!obj.project?.values||typeof obj.project.values!=='object'||!obj.project.photos||typeof obj.project.photos!=='object')throw Error('Fel filformat');await save();project=obj.project;project.id=newId();refreshForm();await save();status('Projekt importerat och sparat')}catch(err){alert('Import misslyckades: '+err.message)}e.target.value=''};
async function pdf(){clearTimeout(saveTimer);await save();makeReport();document.body.classList.add('previewing');window.scrollTo(0,0)}
document.getElementById('pdfBtn').textContent='Förhandsvisa / skapa PDF';document.getElementById('pdfBottom').textContent='Förhandsvisa / skapa PDF';document.getElementById('pdfBtn').onclick=pdf;document.getElementById('pdfBottom').onclick=pdf;
window.addEventListener('beforeprint',makeReport);
(async()=>{try{db=await openDb();let all=await request(transaction('readonly').getAll());if(all.length){all.sort((a,b)=>b.updated-a.updated);project=all[0];status('Senaste projektet öppnat automatiskt')}build();await refreshList()}catch(e){build();status('Lokal lagring är inte tillgänglig. Använd Säkerhetskopia för att spara projektet.')}})();
</script></body></html>
